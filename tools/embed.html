<!-- ===========================================================================
     CarCrash - Google Sites embed
     Paste the whole file into: Google Sites -> Insert -> Embed -> Embed code

     The jsDelivr URL below is PINNED TO A COMMIT HASH. After every new build:
       1. bash tools/publish.sh
       2. git add prod && git commit && git push
       3. git rev-parse HEAD          <- copy that hash
       4. replace the hash in BUILD_BASE below
       5. re-paste this file into Google Sites
     Pinning to a hash instead of a branch matters: jsDelivr caches branch URLs
     aggressively and will happily serve you a stale build for hours.
     =========================================================================== -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<base target="_blank">

<style>
  html, body { height: 100%; margin: 0; background: #1a1a1a; overflow: hidden; }
  #wrap { position: relative; width: 100%; height: 100%; }
  #unity-canvas {
    display: block; width: 100%; height: 100%;
    background: #231f20; outline: none;
  }
  #cover {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    color: #eee; font: 14px/1.5 system-ui, sans-serif;
    background: #1a1a1a; text-align: center; padding: 20px;
  }
  #bar-empty {
    width: 220px; height: 14px; border: 1px solid #666;
    padding: 2px; margin-top: 14px;
  }
  #bar-full { width: 0%; height: 100%; background: #f0c000; transition: width .1s; }
  #err {
    display: none; position: absolute; inset: 0; overflow: auto;
    background: #300; color: #fdd; padding: 16px;
    font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap;
  }
  #fs {
    position: absolute; bottom: 6px; left: 10px;
    background: rgba(0,0,0,.45); color: #ddd; border: 1px solid #555;
    border-radius: 4px; padding: 4px 9px; cursor: pointer;
    font: 12px system-ui, sans-serif;
  }
  #fs:hover { background: rgba(0,0,0,.75); color: #fff; }
  #hint {
    position: absolute; bottom: 6px; right: 10px;
    color: #888; font: 11px system-ui, sans-serif; pointer-events: none;
  }
</style>

<div id="wrap">
  <canvas id="unity-canvas" tabindex="-1"></canvas>

  <div id="cover">
    <div id="status">Loading…</div>
    <div id="bar-empty"><div id="bar-full"></div></div>
    <div style="margin-top:12px;color:#777;font-size:12px">~10 MB, first load only</div>
  </div>

  <div id="err"></div>
  <button id="fs" type="button">&#9974; Fullscreen</button>
  <div id="hint">click to focus &middot; WASD / arrows</div>
</div>

<script>
(function () {
  var BUILD_BASE =
    "https://cdn.jsdelivr.net/gh/doc11577/CarCrash@637b428f69e3ee4269394e88f36f632ab388e8b5/prod";

  var canvas  = document.querySelector("#unity-canvas");
  var cover   = document.querySelector("#cover");
  var status  = document.querySelector("#status");
  var barFull = document.querySelector("#bar-full");
  var errBox  = document.querySelector("#err");

  function fail(msg) {
    errBox.style.display = "block";
    errBox.textContent += msg + "\n";
    cover.style.display = "none";
  }

  // Surface errors on screen. There is no console on a locked-down Chromebook.
  window.addEventListener("error", function (e) {
    fail("ERROR: " + (e.message || e.error) + "\n  at " + e.filename + ":" + e.lineno);
  });

  var config = {
    dataUrl:            BUILD_BASE + "/carcrash.data.unityweb",
    frameworkUrl:       BUILD_BASE + "/carcrash.framework.js.unityweb",
    codeUrl:            BUILD_BASE + "/carcrash.wasm.unityweb",
    streamingAssetsUrl: BUILD_BASE + "/StreamingAssets",
    companyName:        "DefaultCompany",
    productName:        "CarCrash",
    productVersion:     "0.1.0",
    showBanner:         null
  };

  // Keyboard input dies in a sandboxed iframe unless the canvas actually holds
  // focus. Google Sites nests this two iframes deep, so grab focus on any
  // interaction and keep it.
  function grabFocus() {
    window.focus();
    canvas.focus();
  }

  // ---- fullscreen -------------------------------------------------------
  // Done HERE rather than only in Unity because this is the layer that can
  // tell the player WHY it failed. Google Sites nests this page in an iframe
  // we do not control, and if that iframe was not granted fullscreen the
  // request is refused no matter what the game does.
  //
  // Requesting on #wrap rather than the canvas keeps the loading bar and the
  // error pane inside the fullscreen view, so a crash while fullscreen is
  // still readable.
  var wrap = document.querySelector("#wrap");
  var fsBtn = document.querySelector("#fs");

  function fsActive() {
    return document.fullscreenElement || document.webkitFullscreenElement;
  }

  function paintFs() {
    fsBtn.innerHTML = fsActive() ? "&#9974; Exit fullscreen" : "&#9974; Fullscreen";
  }

  if (!document.fullscreenEnabled && !document.webkitFullscreenEnabled) {
    // The embedding page has not allowed it. Say so instead of leaving a
    // button that does nothing, and point at the key that always works.
    fsBtn.textContent = "Fullscreen blocked — use the Chromebook fullscreen key";
    fsBtn.disabled = true;
    fsBtn.style.cursor = "default";
  } else {
    fsBtn.addEventListener("click", function () {
      var target = fsActive() ? null : wrap;
      var done;
      if (target) {
        done = (target.requestFullscreen || target.webkitRequestFullscreen).call(target);
      } else {
        done = (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      }
      Promise.resolve(done).catch(function () {
        fsBtn.textContent = "Fullscreen refused by the page";
      });
      // Keyboard dies if focus leaves the canvas, and the button just took it.
      setTimeout(function () { canvas.focus(); }, 50);
    });
    document.addEventListener("fullscreenchange", paintFs);
    document.addEventListener("webkitfullscreenchange", paintFs);
  }

  canvas.addEventListener("pointerdown", grabFocus);
  canvas.addEventListener("touchstart", grabFocus, { passive: true });
  window.addEventListener("load", grabFocus);

  // Stop arrow keys and space from scrolling the host page out from under us.
  window.addEventListener("keydown", function (e) {
    if (["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].indexOf(e.key) !== -1) {
      e.preventDefault();
    }
  }, false);

  var script = document.createElement("script");
  script.src = BUILD_BASE + "/carcrash.loader.js";

  script.onerror = function () {
    fail("Could not load carcrash.loader.js from:\n" + BUILD_BASE +
         "\n\nEither the commit hash is wrong, the repo is private, " +
         "or cdn.jsdelivr.net is blocked on this network.");
  };

  script.onload = function () {
    if (typeof createUnityInstance !== "function") {
      fail("loader.js loaded but createUnityInstance is missing.");
      return;
    }
    createUnityInstance(canvas, config, function (p) {
      barFull.style.width = (100 * p) + "%";
      status.textContent = p < 1 ? "Loading… " + Math.round(p * 100) + "%" : "Starting…";
    }).then(function () {
      cover.style.display = "none";
      grabFocus();
    }).catch(function (message) {
      fail("Unity failed to start:\n" + message);
    });
  };

  document.body.appendChild(script);
})();
</script>
